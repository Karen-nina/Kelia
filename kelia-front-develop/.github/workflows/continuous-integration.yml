name: Test and Coverage Check (PR)

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.base_ref == 'main' && github.head_ref == 'develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm run jest:coverage

      - name: Extract coverage from coverage-summary.json
        id: coverage
        run: |
          FILE="coverage/coverage-summary.json"
          if [ ! -f "$FILE" ]; then
            echo "❌ coverage-summary.json no encontrado"
            exit 1
          fi

          COVERAGE=$(jq '.total.lines.pct' "$FILE")
          echo "📊 Total de líneas con coverage: $COVERAGE%"
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Warn if coverage < 50%
        if: ${{ steps.coverage.outputs.coverage < 50 }}
        run: |
          echo "⚠️ El coverage es menor a 50%. Revisa antes de mergear."

      - name: Success if coverage ≥ 50%
        if: ${{ steps.coverage.outputs.coverage >= 50 }}
        run: |
          echo "✅ El coverage es de ${{ steps.coverage.outputs.coverage }}%. Buen trabajo!"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true
          verbose: true